apiVersion: v1
kind: Secret
metadata:
  name: saltea-admin-secrets
  namespace: default
type: Opaque
data:
  # Base64-encode all values: echo -n 'value' | base64
  #
  # Database (SHARED with dna-admin — same PostgreSQL instance)
  DATABASE_HOST: xxx       # db-entrypoint
  DATABASE_PORT: xxx       # 5432
  DATABASE_NAME: xxx       # dna_admin_production
  DATABASE_USER: xxx       # postgres
  DATABASE_PASS: xxx       # (same password as dna-admin-secrets)
  #
  # Rails
  SECRET_KEY_BASE: xxx     # Generate with: rails secret
  #
  # Spree
  SPREE_API_KEY: xxx
